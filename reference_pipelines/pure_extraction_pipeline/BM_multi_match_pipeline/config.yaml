provider:
  base_url: "https://api.qnaigc.com/v1"
  model: "deepseek/deepseek-v4-pro"
  timeout_sec: 300
  api_keys: []

paths:
  papers_dir: "_tmp_magnetic_pipeline/papers"
  prompts_dir: "prompts"
  outputs_dir: "_tmp_magnetic_pipeline/outputs"
  logs_dir: "_tmp_magnetic_pipeline/logs"

stages:
  manifest:
    temperature: 0.0
  fact_candidates:
    temperature: 0.0
  matcher:
    temperature: 0.0
  aggregate:
    temperature: 0.0
